<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز كنيسة الأنبا أنطونيوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#1e3a5f;
    --navy-deep:#16293f;
    --gold:#c9a24a;
    --gold-light:#e6cf94;
    --cream:#faf6ea;
    --cream-deep:#f1e9d2;
    --ink:#2a2a28;
    --muted:#7c7566;
    --white:#fffefb;
    --danger:#a5402f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo', 'Tahoma', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    position:relative;
  }
  /* subtle watermark background */
  .bg-watermark{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .bg-watermark img{
    width:min(70vw,640px);
    opacity:0.05;
    filter:grayscale(15%);
  }
  .app{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:0 18px 60px;
  }
  header.top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:26px 10px 20px;
    gap:6px;
  }
  header.top .logo-badge{
    width:78px;height:78px;border-radius:50%;
    overflow:hidden;
    border:3px solid var(--gold);
    box-shadow:0 4px 14px rgba(30,58,95,0.18);
    background:var(--white);
    margin-bottom:6px;
  }
  header.top .logo-badge img{width:100%;height:100%;object-fit:cover;}
  header.top h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    color:var(--navy);
    letter-spacing:.5px;
  }
  header.top .sub{
    font-family:'Amiri', serif;
    color:var(--gold);
    font-size:1.05rem;
    font-weight:700;
  }
  header.top .tagline{
    color:var(--muted);
    font-size:.85rem;
    margin-top:2px;
  }
  .divider-orn{
    display:flex;align-items:center;gap:10px;
    color:var(--gold);
    margin:10px 0 4px;
    width:100%;
    max-width:260px;
  }
  .divider-orn::before,.divider-orn::after{
    content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent);
  }
  .divider-orn span{font-size:.9rem;}

  /* Home: grades grid */
  .section-title{
    font-size:1.05rem;
    font-weight:700;
    color:var(--navy);
    margin:22px 4px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .count-pill{
    background:var(--cream-deep);
    color:var(--muted);
    font-size:.75rem;
    font-weight:600;
    padding:2px 10px;
    border-radius:20px;
  }
  .grades-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
  }
  .grade-card{
    background:var(--white);
    border:1px solid var(--cream-deep);
    border-radius:var(--radius);
    padding:16px 14px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s;
    text-align:right;
    position:relative;
    overflow:hidden;
  }
  .grade-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(30,58,95,0.12);
    border-color:var(--gold-light);
  }
  .grade-card .stage-tag{
    font-size:.68rem;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .grade-card h3{
    margin:6px 0 10px;
    font-size:1rem;
    color:var(--navy);
    font-weight:700;
  }
  .grade-card .num{
    font-size:1.6rem;
    font-weight:800;
    color:var(--navy);
  }
  .grade-card .num-label{
    font-size:.72rem;
    color:var(--muted);
  }
  .grade-card::after{
    content:"";
    position:absolute;
    inset-inline-start:0;
    top:0;bottom:0;
    width:4px;
    background:var(--gold);
    opacity:0;
    transition:opacity .15s;
  }
  .grade-card:hover::after{opacity:1;}

  /* Grade detail view */
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--navy);
    font-family:inherit;
    font-size:.92rem;
    font-weight:700;
    cursor:pointer;
    padding:14px 4px 0;
  }
  .grade-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin:10px 4px 16px;
  }
  .grade-header h2{
    margin:0;
    color:var(--navy);
    font-size:1.3rem;
  }
  .grade-header .meta{
    color:var(--muted);
    font-size:.85rem;
  }
  .btn{
    font-family:inherit;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:.9rem;
    font-weight:700;
    cursor:pointer;
    transition:filter .15s, transform .1s;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--navy);color:var(--white);}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
  .btn-outline:hover{background:var(--navy);color:var(--white);}
  .btn-danger-text{background:none;color:var(--danger);padding:6px 8px;font-size:.82rem;}
  .btn-excel{background:#1e6b3f;color:var(--white);}
  .btn-excel:hover{filter:brightness(1.12);}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:12px;}
  .mode-pill{padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:700;}
  .mode-admin{background:#dff0e2;color:#1e6b3f;}
  .mode-view{background:var(--cream-deep);color:var(--muted);}
  .btn-sm{padding:7px 13px;font-size:.76rem;}
  #debug-box{
    max-width:520px;
    margin:14px auto 0;
    background:#fff2f0;
    border:1.5px solid var(--danger);
    color:#7a2a1e;
    border-radius:12px;
    padding:12px 14px;
    font-size:.78rem;
    text-align:right;
    direction:rtl;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #debug-box .debug-title{
    font-weight:800;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  #debug-box .debug-close{
    background:none;border:none;color:#7a2a1e;font-size:1rem;cursor:pointer;padding:2px 8px;
  }
  #debug-box code{
    display:block;
    background:#fff;
    border-radius:8px;
    padding:8px 10px;
    margin-top:4px;
    font-family:monospace;
    font-size:.74rem;
    direction:ltr;
    text-align:left;
  }

  .search-bar{
    width:100%;
    padding:11px 14px;
    border:1.5px solid var(--cream-deep);
    border-radius:10px;
    font-family:inherit;
    font-size:.92rem;
    background:var(--white);
    margin-bottom:14px;
  }
  .search-bar:focus{outline:none;border-color:var(--gold);}

  .student-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .student-card{
    background:var(--white);
    border:1px solid var(--cream-deep);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .student-card .s-name{
    font-weight:700;
    color:var(--navy);
    font-size:1rem;
  }
  .student-card .s-line{
    color:var(--muted);
    font-size:.82rem;
    margin-top:3px;
  }
  .teacher-chip{
    display:inline-block;
    background:var(--cream-deep);
    color:var(--navy);
    font-size:.75rem;
    font-weight:600;
    padding:3px 10px;
    border-radius:20px;
    margin:4px 4px 0 0;
  }
  .student-actions{
    display:flex;
    gap:4px;
  }
  .icon-btn{
    background:none;border:none;cursor:pointer;
    color:var(--muted);
    font-size:1rem;
    padding:6px;
    border-radius:8px;
  }
  .icon-btn:hover{background:var(--cream-deep);color:var(--navy);}
  .icon-btn.del:hover{color:var(--danger);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty-state .big{
    font-size:2.2rem;
    margin-bottom:8px;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(22,41,63,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--cream);
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:22px 20px 26px;
    animation:slideUp .2s ease;
  }
  @media(min-width:600px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px;}
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h2{
    margin:0 0 4px;
    color:var(--navy);
    font-size:1.2rem;
  }
  .modal .modal-sub{
    color:var(--muted);
    font-size:.82rem;
    margin-bottom:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:.85rem;
    font-weight:700;
    color:var(--navy);
    margin-bottom:6px;
  }
  .field .optional-tag{
    color:var(--muted);
    font-weight:400;
    font-size:.75rem;
  }
  .field input, .field select{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--cream-deep);
    border-radius:10px;
    font-family:inherit;
    font-size:.92rem;
    background:var(--white);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .field .hint{font-size:.72rem;color:var(--muted);margin-top:4px;}

  .teachers-block{
    background:var(--white);
    border:1px dashed var(--cream-deep);
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
  }
  .teachers-block-title{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .teachers-block-title span{font-weight:700;color:var(--navy);font-size:.9rem;}
  .teacher-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
  }
  .teacher-row input{
    flex:1;
    padding:9px 11px;
    border:1.5px solid var(--cream-deep);
    border-radius:8px;
    font-family:inherit;
    font-size:.86rem;
  }
  .teacher-row input:focus{outline:none;border-color:var(--gold);}
  .teacher-row button{
    background:var(--cream-deep);
    border:none;
    color:var(--danger);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    flex-shrink:0;
  }
  .add-teacher-btn{
    background:none;
    border:1.5px dashed var(--gold);
    color:var(--navy);
    width:100%;
    padding:9px;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
    font-size:.84rem;
    cursor:pointer;
  }
  .add-teacher-btn:hover{background:var(--gold-light);}
  .modal-buttons{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .modal-buttons .btn{flex:1;justify-content:center;}
  .err-msg{
    color:var(--danger);
    font-size:.8rem;
    margin-top:4px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--white);
    padding:12px 22px;
    border-radius:30px;
    font-size:.86rem;
    font-weight:600;
    z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    animation:fadeIn .2s ease;
  }
  ::selection{background:var(--gold-light);}
  @media(max-width:420px){
    header.top h1{font-size:1.25rem;}
    .grades-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  }
</style>
</head>

<script>
/* ---------- Data ---------- */
const GRADES = [
  {id:'p1', stage:'ابتدائي', name:'الصف الأول الابتدائي'},
  {id:'p2', stage:'ابتدائي', name:'الصف الثاني الابتدائي'},
  {id:'p3', stage:'ابتدائي', name:'الصف الثالث الابتدائي'},
  {id:'p4', stage:'ابتدائي', name:'الصف الرابع الابتدائي'},
  {id:'p5', stage:'ابتدائي', name:'الصف الخامس الابتدائي'},
  {id:'p6', stage:'ابتدائي', name:'الصف السادس الابتدائي'},
  {id:'m1', stage:'إعدادي', name:'الصف الأول الإعدادي'},
  {id:'m2', stage:'إعدادي', name:'الصف الثاني الإعدادي'},
  {id:'m3', stage:'إعدادي', name:'الصف الثالث الإعدادي'},
  {id:'s1', stage:'ثانوي', name:'الصف الأول الثانوي'},
  {id:'s2', stage:'ثانوي', name:'الصف الثاني الثانوي'},
  {id:'s3', stage:'ثانوي', name:'الصف الثالث الثانوي'},
];

let students = []; // {id, gradeId, name, phone, nationalId, teachers:[names]}
let currentGrade = null;
let editingStudentId = null;
let dataLoaded = false;
let isAdmin = false;
let adminPasscode = null;

/* ---------- Firebase / Firestore setup ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDbZ6pRVMBJ7rLbHkXYVrH5uUr9MIHfxbk",
  authDomain: "kerolos-sameh.firebaseapp.com",
  projectId: "kerolos-sameh",
  storageBucket: "kerolos-sameh.firebasestorage.app",
  messagingSenderId: "40042445802",
  appId: "1:40042445802:web:15a3f80c10eb0857a45093",
  measurementId: "G-V2W0XG1EPF"
};
const fbApp = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDocRef = db.collection('churchApp').doc('state');

const LOCAL_UNLOCK_KEY = 'church_app_device_unlock_v1';

function errText(e){
  return (e && e.message) ? e.message : String(e);
}

function renderCurrentView(){
  currentGrade ? renderGradeView() : renderHome();
}

function recomputeIsAdmin(){
  let localUnlock = null;
  try{ localUnlock = localStorage.getItem(LOCAL_UNLOCK_KEY); }catch(e){}
  isAdmin = !!(adminPasscode && localUnlock === adminPasscode);
}

/* Live sync: listens to Firestore in real time, updates UI on any change from any device */
let firstSnapshotResolved = false;
function initFirestoreSync(){
  return new Promise((resolve)=>{
    stateDocRef.onSnapshot((snap)=>{
      const data = snap.exists ? snap.data() : {};
      try{
        students = data.students ? JSON.parse(data.students) : [];
      }catch(e){
        students = [];
      }
      adminPasscode = data.adminPasscode || null;
      recomputeIsAdmin();
      dataLoaded = true;

      if(!firstSnapshotResolved){
        firstSnapshotResolved = true;
        resolve();
      }else{
        renderAdminBadge();
        renderCurrentView();
      }
    }, (err)=>{
      showToast('تعذر الاتصال بقاعدة البيانات: ' + errText(err));
      showDebug('مزامنة Firestore (onSnapshot)', err);
      if(!firstSnapshotResolved){
        firstSnapshotResolved = true;
        dataLoaded = true;
        resolve();
      }
    });
  });
}

async function saveData(){
  try{
    await stateDocRef.set({ students: JSON.stringify(students) }, { merge: true });
  }catch(e){
    showToast('حدث خطأ أثناء الحفظ: ' + errText(e));
    showDebug('حفظ بيانات الطلاب (saveData)', e);
  }
}

function closeGenericModal(){
  document.getElementById('modal-root').innerHTML = '';
}

function openPinSetupModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="setup-overlay">
      <div class="modal">
        <h2>🔐 إعداد رقم سري للتحكم</h2>
        <div class="modal-sub">أول مرة يتفتح فيها البرنامج. حط رقم سري هيبقى مطلوب لإضافة/تعديل/حذف الطلاب، واحتفظ بيه لنفسك قبل ما تبعت اللينك لحد.</div>
        <div class="field">
          <label>الرقم السري</label>
          <input type="text" id="setup-pin1" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="اكتب رقم أو كلمة سر" autocomplete="off">
        </div>
        <div class="field">
          <label>أعد كتابته للتأكيد</label>
          <input type="text" id="setup-pin2" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="اكتب نفس الرقم تاني" autocomplete="off">
          <div class="err-msg" id="setup-err" style="display:none;"></div>
        </div>
        <div class="modal-buttons">
          <button class="btn btn-primary" id="setup-save-btn" style="width:100%;">حفظ وابدأ كمشرف</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('setup-save-btn').addEventListener('click', async ()=>{
    const a = document.getElementById('setup-pin1').value.trim();
    const b = document.getElementById('setup-pin2').value.trim();
    const err = document.getElementById('setup-err');
    const btn = document.getElementById('setup-save-btn');
    err.style.display = 'none';
    if(!a){ err.textContent='لازم تكتب رقم سري'; err.style.display='block'; return; }
    if(a !== b){ err.textContent='الرقمين مش متطابقين'; err.style.display='block'; return; }
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    try{
      await setupPasscode(a);
      closeGenericModal();
      showToast('تم تسجيلك كمشرف على هذا الجهاز');
      renderAdminBadge();
      currentGrade ? renderGradeView() : renderHome();
    }catch(e){
      btn.disabled = false; btn.textContent = 'حفظ وابدأ كمشرف';
      err.textContent = 'حصل خطأ: ' + errText(e);
      err.style.display = 'block';
      showDebug('حفظ الرقم السري لأول مرة (setup)', e);
    }
  });
}

async function setupPasscode(pin){
  await stateDocRef.set({ adminPasscode: pin }, { merge: true });
  try{ localStorage.setItem(LOCAL_UNLOCK_KEY, pin); }catch(e){}
  adminPasscode = pin;
  isAdmin = true;
}

function openAdminLoginModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="login-overlay">
      <div class="modal">
        <h2>🔒 دخول كمشرف</h2>
        <div class="modal-sub">اكتب الرقم السري للتحكم في البيانات</div>
        <div class="field">
          <label>الرقم السري</label>
          <input type="text" id="login-pin" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="الرقم السري" autocomplete="off">
          <div class="err-msg" id="login-err" style="display:none;">الرقم السري غير صحيح</div>
        </div>
        <div class="modal-sub" style="margin-top:-6px;">لو نسيت الرقم السري، محدش يقدر يسترجعه — احتفظ بيه في مكان أمين.</div>
        <div class="modal-buttons">
          <button class="btn btn-outline" id="login-cancel-btn">إلغاء</button>
          <button class="btn btn-primary" id="login-confirm-btn">دخول</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('login-overlay').addEventListener('click', (e)=>{ if(e.target.id==='login-overlay') closeGenericModal(); });
  document.getElementById('login-cancel-btn').addEventListener('click', closeGenericModal);
  document.getElementById('login-confirm-btn').addEventListener('click', ()=>{
    const val = document.getElementById('login-pin').value.trim();
    if(val === adminPasscode){
      try{ localStorage.setItem(LOCAL_UNLOCK_KEY, adminPasscode); }catch(e){}
      isAdmin = true;
      closeGenericModal();
      showToast('تم الدخول كمشرف');
      renderAdminBadge();
      currentGrade ? renderGradeView() : renderHome();
    }else{
      document.getElementById('login-err').style.display = 'block';
    }
  });
}

function adminLogout(){
  isAdmin = false;
  try{ localStorage.removeItem(LOCAL_UNLOCK_KEY); }catch(e){}
  showToast('تم الخروج من وضع المشرف');
  renderAdminBadge();
  currentGrade ? renderGradeView() : renderHome();
}

function openChangePinModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="change-overlay">
      <div class="modal">
        <h2>تغيير الرقم السري</h2>
        <div class="field">
          <label>الرقم السري الحالي</label>
          <input type="text" id="change-cur" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="الرقم الحالي" autocomplete="off">
        </div>
        <div class="field">
          <label>الرقم السري الجديد</label>
          <input type="text" id="change-new" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="الرقم الجديد" autocomplete="off">
          <div class="err-msg" id="change-err" style="display:none;"></div>
        </div>
        <div class="modal-buttons">
          <button class="btn btn-outline" id="change-cancel-btn">إلغاء</button>
          <button class="btn btn-primary" id="change-save-btn">حفظ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('change-overlay').addEventListener('click', (e)=>{ if(e.target.id==='change-overlay') closeGenericModal(); });
  document.getElementById('change-cancel-btn').addEventListener('click', closeGenericModal);
  document.getElementById('change-save-btn').addEventListener('click', async ()=>{
    const cur = document.getElementById('change-cur').value.trim();
    const next = document.getElementById('change-new').value.trim();
    const err = document.getElementById('change-err');
    const btn = document.getElementById('change-save-btn');
    err.style.display = 'none';
    if(cur !== adminPasscode){ err.textContent='الرقم الحالي غير صحيح'; err.style.display='block'; return; }
    if(!next){ err.textContent='لازم تكتب رقم جديد'; err.style.display='block'; return; }
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    try{
      await setupPasscode(next);
      closeGenericModal();
      showToast('تم تغيير الرقم السري بنجاح');
      renderAdminBadge();
      currentGrade ? renderGradeView() : renderHome();
    }catch(e){
      btn.disabled = false; btn.textContent = 'حفظ';
      err.textContent = 'حصل خطأ: ' + errText(e);
      err.style.display = 'block';
      showDebug('تغيير الرقم السري (change pin)', e);
    }
  });
}

function renderAdminBadge(){
  const el = document.getElementById('admin-badge');
  if(!el) return;
  if(isAdmin){
    el.innerHTML = `
      <span class="mode-pill mode-admin">🔓 وضع التحكم (مشرف)</span>
      <button class="btn btn-excel btn-sm" id="export-all-btn">⬇ تنزيل كل البيانات Excel</button>
      <button class="btn btn-outline btn-sm" id="change-pin-btn">تغيير الرقم السري</button>
      <button class="btn btn-outline btn-sm" id="logout-btn">تسجيل خروج</button>
    `;
    document.getElementById('export-all-btn').addEventListener('click', ()=> exportToExcel(null));
    document.getElementById('change-pin-btn').addEventListener('click', openChangePinModal);
    document.getElementById('logout-btn').addEventListener('click', adminLogout);
  }else{
    el.innerHTML = `
      <span class="mode-pill mode-view">👁 وضع العرض فقط</span>
      <button class="btn btn-outline btn-sm" id="admin-login-btn">🔒 دخول كمشرف</button>
    `;
    document.getElementById('admin-login-btn').addEventListener('click', openAdminLoginModal);
  }
}

/* ---------- Utilities ---------- */
function uid(){
  return 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str == null ? '' : str;
  return d.innerHTML;
}
function showToast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=''; }, 2200);
}
function showDebug(context, err){
  const box = document.getElementById('debug-box');
  if(!box) return;
  const time = new Date().toLocaleTimeString('ar-EG');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="debug-title">
      <span>⚠️ تفاصيل الخطأ (لالتقاط لقطة شاشة)</span>
      <button class="debug-close" id="debug-close-btn">✕ إغلاق</button>
    </div>
    <div>الوقت: ${escapeHtml(time)}</div>
    <div>أثناء: ${escapeHtml(context)}</div>
    <code>${escapeHtml(errText(err))}</code>
  `;
  const closeBtn = document.getElementById('debug-close-btn');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ box.style.display='none'; box.innerHTML=''; });
}
function studentsInGrade(gradeId){
  return students.filter(s=>s.gradeId===gradeId);
}

/* ---------- Excel Export ---------- */
function exportToExcel(gradeId){
  const list = gradeId ? studentsInGrade(gradeId) : students;
  if(list.length === 0){
    showToast('لا يوجد بيانات لتنزيلها');
    return;
  }
  const rows = list.map(s=>{
    const grade = GRADES.find(g=>g.id===s.gradeId);
    return {
      'الصف': grade ? grade.name : '',
      'اسم الطالب': s.name,
      'رقم التليفون': s.phone || '',
      'الرقم القومي': s.nationalId || '',
      'المدرسون': (s.teachers||[]).filter(t=>t&&t.trim()).join('، ') || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:22},{wch:16},{wch:16},{wch:35}];
  const wb = XLSX.utils.book_new();
  const sheetName = gradeId ? GRADES.find(g=>g.id===gradeId).name : 'كل الطلاب';
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  const fileName = gradeId
    ? `طلاب_${GRADES.find(g=>g.id===gradeId).name}.xlsx`
    : `بيانات_كل_الطلاب.xlsx`;
  XLSX.writeFile(wb, fileName);
  showToast('جاري تنزيل الملف...');
}

/* ---------- Rendering: Home ---------- */
function renderHome(){
  const root = document.getElementById('view-root');
  const totalStudents = students.length;

  let stagesHtml = '';
  const stages = [...new Set(GRADES.map(g=>g.stage))];
  stagesHtml = `
    <div class="section-title">الصفوف الدراسية <span class="count-pill">${totalStudents} طالب مسجل</span></div>
    <div class="grades-grid">
      ${GRADES.map(g=>{
        const count = studentsInGrade(g.id).length;
        return `
        <div class="grade-card" data-grade="${g.id}">
          <div class="stage-tag">${escapeHtml(g.stage)}</div>
          <h3>${escapeHtml(g.name)}</h3>
          <div class="num">${count}</div>
          <div class="num-label">${count===1?'طالب':'طالب مسجل'}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  root.innerHTML = stagesHtml;

  root.querySelectorAll('.grade-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      currentGrade = card.getAttribute('data-grade');
      renderGradeView();
    });
  });
}

/* ---------- Rendering: Grade detail ---------- */
function renderGradeView(searchQuery){
  searchQuery = searchQuery || '';
  const root = document.getElementById('view-root');
  const grade = GRADES.find(g=>g.id===currentGrade);
  let list = studentsInGrade(currentGrade);
  if(searchQuery.trim()){
    const q = searchQuery.trim();
    list = list.filter(s=> s.name.includes(q) || (s.phone||'').includes(q));
  }

  root.innerHTML = `
    <button class="back-btn" id="back-btn">→ رجوع للصفوف</button>
    <div class="grade-header">
      <div>
        <h2>${escapeHtml(grade.name)}</h2>
        <div class="meta">${studentsInGrade(currentGrade).length} طالب مسجل في هذا الصف</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${isAdmin ? `
        <button class="btn btn-excel" id="export-grade-btn">⬇ تنزيل Excel</button>
        <button class="btn btn-gold" id="add-student-btn">+ إضافة طالب</button>
        ` : ''}
      </div>
    </div>
    <input type="text" class="search-bar" id="search-input" placeholder="ابحث بالاسم أو رقم التليفون..." value="${escapeHtml(searchQuery)}">
    <div id="student-list-wrap"></div>
  `;

  const listWrap = root.querySelector('#student-list-wrap');
  if(list.length===0){
    listWrap.innerHTML = `
      <div class="empty-state">
        <div class="big">📋</div>
        ${studentsInGrade(currentGrade).length===0
          ? 'لا يوجد طلاب مسجلين في هذا الصف بعد'
          : 'لا توجد نتائج مطابقة للبحث'}
      </div>`;
  }else{
    listWrap.innerHTML = `<div class="student-list">
      ${list.map(s=>studentCardHtml(s)).join('')}
    </div>`;
  }

  root.querySelector('#back-btn').addEventListener('click', ()=>{
    currentGrade = null;
    renderHome();
  });
  if(isAdmin){
    root.querySelector('#add-student-btn').addEventListener('click', ()=>{
      openStudentModal(null);
    });
    root.querySelector('#export-grade-btn').addEventListener('click', ()=>{
      exportToExcel(currentGrade);
    });
  }
  root.querySelector('#search-input').addEventListener('input', (e)=>{
    renderGradeView(e.target.value);
    // refocus + keep cursor at end
    const inp = document.getElementById('search-input');
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });

  listWrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> openStudentModal(btn.getAttribute('data-edit')));
  });
  listWrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteStudent(btn.getAttribute('data-del')));
  });
}

function studentCardHtml(s){
  const teachers = (s.teachers||[]).filter(t=>t && t.trim());
  return `
    <div class="student-card">
      <div>
        <div class="s-name">${escapeHtml(s.name)}</div>
        <div class="s-line">📞 ${escapeHtml(s.phone||'—')}</div>
        ${s.nationalId ? `<div class="s-line">🪪 ${escapeHtml(s.nationalId)}</div>` : ''}
        <div style="margin-top:6px;">
          ${teachers.length ? teachers.map(t=>`<span class="teacher-chip">${escapeHtml(t)}</span>`).join('') : '<span class="s-line">لا يوجد مدرسين مضافين</span>'}
        </div>
      </div>
      ${isAdmin ? `
      <div class="student-actions">
        <button class="icon-btn" data-edit="${s.id}" title="تعديل">✏️</button>
        <button class="icon-btn del" data-del="${s.id}" title="حذف">🗑️</button>
      </div>` : ''}
    </div>
  `;
}

function deleteStudent(id){
  if(!isAdmin) return;
  const s = students.find(x=>x.id===id);
  if(!s) return;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="del-overlay">
      <div class="modal">
        <h2>حذف الطالب</h2>
        <div class="modal-sub">هل تريد حذف الطالب "${escapeHtml(s.name)}"؟ الإجراء ده لا يمكن التراجع عنه.</div>
        <div class="modal-buttons">
          <button class="btn btn-outline" id="del-cancel-btn">إلغاء</button>
          <button class="btn" style="background:var(--danger);color:#fff;flex:1;justify-content:center;" id="del-confirm-btn">حذف نهائيًا</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('del-overlay').addEventListener('click', (e)=>{ if(e.target.id==='del-overlay') closeGenericModal(); });
  document.getElementById('del-cancel-btn').addEventListener('click', closeGenericModal);
  document.getElementById('del-confirm-btn').addEventListener('click', async ()=>{
    students = students.filter(x=>x.id!==id);
    closeGenericModal();
    await saveData();
    renderGradeView();
    showToast('تم حذف الطالب');
  });
}

/* ---------- Modal: Add / Edit student ---------- */
function openStudentModal(studentId){
  if(!isAdmin) return;
  editingStudentId = studentId;
  const isEdit = !!studentId;
  const s = isEdit ? students.find(x=>x.id===studentId) : {name:'',phone:'',nationalId:'',teachers:['']};
  const teachersInit = (s.teachers && s.teachers.length) ? s.teachers : [''];

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h2>${isEdit ? 'تعديل بيانات الطالب' : 'إضافة طالب جديد'}</h2>
        <div class="modal-sub">${escapeHtml(GRADES.find(g=>g.id===currentGrade).name)}</div>

        <div class="field">
          <label>اسم الطالب</label>
          <input type="text" id="f-name" placeholder="اكتب الاسم بالكامل" value="${escapeHtml(s.name)}">
          <div class="err-msg" id="err-name" style="display:none;">من فضلك اكتب اسم الطالب</div>
        </div>

        <div class="field">
          <label>رقم التليفون</label>
          <input type="tel" id="f-phone" placeholder="01xxxxxxxxx" value="${escapeHtml(s.phone||'')}">
          <div class="err-msg" id="err-phone" style="display:none;">من فضلك اكتب رقم تليفون صحيح</div>
        </div>

        <div class="field">
          <label>الرقم القومي <span class="optional-tag">(اختياري)</span></label>
          <input type="text" id="f-national" placeholder="14 رقم" maxlength="14" value="${escapeHtml(s.nationalId||'')}">
        </div>

        <div class="teachers-block">
          <div class="teachers-block-title">
            <span>المدرسون <span class="optional-tag">(اختياري)</span></span>
          </div>
          <div id="teachers-rows"></div>
          <button type="button" class="add-teacher-btn" id="add-teacher-row">+ إضافة مدرس</button>
        </div>

        <div class="modal-buttons">
          <button class="btn btn-outline" id="cancel-btn">إلغاء</button>
          <button class="btn btn-primary" id="save-btn">${isEdit ? 'حفظ التعديلات' : 'إضافة الطالب'}</button>
        </div>
      </div>
    </div>
  `;

  const rowsWrap = root.querySelector('#teachers-rows');
  function addTeacherRow(value){
    const row = document.createElement('div');
    row.className = 'teacher-row';
    row.innerHTML = `<input type="text" class="teacher-input" placeholder="اسم المدرس / المادة" value="${escapeHtml(value||'')}">
      <button type="button" class="remove-row" title="حذف">✕</button>`;
    row.querySelector('.remove-row').addEventListener('click', ()=>{
      row.remove();
      if(rowsWrap.children.length===0) addTeacherRow('');
    });
    rowsWrap.appendChild(row);
  }
  teachersInit.forEach(t=>addTeacherRow(t));

  root.querySelector('#add-teacher-row').addEventListener('click', ()=> addTeacherRow(''));
  root.querySelector('#cancel-btn').addEventListener('click', closeModal);
  root.querySelector('#overlay').addEventListener('click', (e)=>{
    if(e.target.id==='overlay') closeModal();
  });
  root.querySelector('#save-btn').addEventListener('click', ()=> saveStudent(isEdit));
}

function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
  editingStudentId = null;
}

async function saveStudent(isEdit){
  const nameEl = document.getElementById('f-name');
  const phoneEl = document.getElementById('f-phone');
  const nationalEl = document.getElementById('f-national');
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const nationalId = nationalEl.value.trim();

  let valid = true;
  document.getElementById('err-name').style.display = 'none';
  document.getElementById('err-phone').style.display = 'none';

  if(!name){
    document.getElementById('err-name').style.display = 'block';
    valid = false;
  }
  if(!phone || phone.replace(/\D/g,'').length < 8){
    document.getElementById('err-phone').style.display = 'block';
    valid = false;
  }
  if(!valid) return;

  const teacherInputs = [...document.querySelectorAll('.teacher-input')];
  const teachers = teacherInputs.map(i=>i.value.trim()).filter(v=>v);

  if(isEdit){
    const s = students.find(x=>x.id===editingStudentId);
    s.name = name; s.phone = phone; s.nationalId = nationalId; s.teachers = teachers;
  }else{
    students.push({
      id: uid(),
      gradeId: currentGrade,
      name, phone, nationalId, teachers
    });
  }

  await saveData();
  closeModal();
  renderGradeView();
  showToast(isEdit ? 'تم حفظ التعديلات' : 'تمت إضافة الطالب بنجاح');
}

/* ---------- Init ---------- */
async function init(){
  document.getElementById('view-root').innerHTML = '<div class="empty-state">جاري الاتصال بقاعدة البيانات...</div>';
  await initFirestoreSync();
  renderAdminBadge();
  if(!adminPasscode){
    setTimeout(openPinSetupModal, 350);
  }
  renderHome();
}
init();
</script>
